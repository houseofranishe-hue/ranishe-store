<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — House of Ranishè</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#1C1416; --ivory:#F7F3EC; --paper:#FBF8F3; --rani:#93124A; --gold:#B8862E; --muted:#8A7B7E; --line:rgba(28,20,22,0.12); --green:#3C6E5C; }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--ivory); color:var(--ink); font-family:'Jost',sans-serif; font-weight:300; }
  .wrap{ max-width:1080px; margin:0 auto; padding:28px 22px 80px; }
  h1{ font-size:16px; letter-spacing:0.12em; text-transform:uppercase; font-weight:500; margin:0; }
  button{ font-family:'Jost'; cursor:pointer; }
  input, select, textarea{ font-family:'Jost'; font-size:13px; }

  .login{ max-width:360px; margin:60px auto; }
  .login input{ width:100%; padding:12px; border:1px solid var(--line); background:var(--paper); margin-bottom:10px; }
  .btn{ background:var(--ink); color:var(--ivory); border:none; padding:11px 20px; font-size:11px; letter-spacing:0.1em; text-transform:uppercase; }
  .btn.sm{ padding:7px 12px; font-size:10px; }
  .btn.ghost{ background:none; border:1px solid var(--ink); color:var(--ink); }
  .btn.danger{ background:none; border:1px solid var(--rani); color:var(--rani); }

  .tabs{ display:flex; gap:8px; border-bottom:1px solid var(--line); margin:22px 0 24px; flex-wrap:wrap; }
  .tab{ background:none; border:none; padding:10px 16px; font-size:11.5px; letter-spacing:0.08em; text-transform:uppercase; color:var(--muted); border-bottom:2px solid transparent; margin-bottom:-1px; }
  .tab.active{ color:var(--ink); border-color:var(--rani); }
  .hidden{ display:none; }

  .topbar{ display:flex; justify-content:space-between; align-items:center; }
  .logout{ font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:var(--muted); background:none; border:none; text-decoration:underline; }

  table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  th{ text-align:left; font-weight:500; font-size:10px; letter-spacing:0.1em; text-transform:uppercase; color:var(--muted); padding:8px 8px; border-bottom:1px solid var(--line); }
  td{ padding:9px 8px; border-bottom:1px solid var(--line); }
  td.r, th.r{ text-align:right; }
  .soldout{ color:var(--rani); font-weight:500; }
  .low{ color:var(--gold); }
  .thumb{ width:34px; height:34px; object-fit:cover; background:var(--paper); border:1px solid var(--line); }

  .toolbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; gap:12px; flex-wrap:wrap; }
  .search{ padding:9px 12px; border:1px solid var(--line); background:var(--paper); min-width:200px; }

  /* modal */
  .modal-bg{ position:fixed; inset:0; background:rgba(28,20,22,0.45); display:none; align-items:flex-start; justify-content:center; padding:40px 16px; overflow-y:auto; z-index:100; }
  .modal-bg.open{ display:flex; }
  .modal{ background:var(--ivory); width:min(520px,100%); padding:26px; }
  .modal h2{ font-size:13px; letter-spacing:0.1em; text-transform:uppercase; font-weight:500; margin:0 0 18px; }
  .field{ margin-bottom:13px; }
  .field label{ display:block; font-size:10px; letter-spacing:0.08em; text-transform:uppercase; color:var(--muted); margin-bottom:5px; }
  .field input, .field select, .field textarea{ width:100%; padding:10px; border:1px solid var(--line); background:var(--paper); }
  .field textarea{ min-height:60px; resize:vertical; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .modal-actions{ display:flex; justify-content:space-between; margin-top:20px; }
  .preview{ width:60px; height:60px; object-fit:cover; border:1px solid var(--line); margin-top:6px; background:var(--paper); }

  /* report cards */
  .cards{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:26px; }
  @media (max-width:760px){ .cards{grid-template-columns:repeat(2,1fr);} }
  .rcard{ background:var(--paper); border:1px solid var(--line); padding:18px; }
  .rcard .label{ font-size:10px; letter-spacing:0.1em; text-transform:uppercase; color:var(--muted); }
  .rcard .val{ font-size:24px; font-weight:400; margin-top:8px; }
  .rcard .val.pos{ color:var(--green); } .rcard .val.neg{ color:var(--rani); }
  .rsection{ margin-top:24px; } .rsection h3{ font-size:12px; letter-spacing:0.08em; text-transform:uppercase; font-weight:500; margin:0 0 12px; }
  .err{ color:var(--rani); font-size:12px; margin-top:8px; min-height:16px; }
  .empty{ color:var(--muted); font-size:13px; padding:20px 0; }
  .status-sel{ padding:5px 6px; border:1px solid var(--line); background:var(--ivory); font-size:11px; }
</style>
</head>
<body>

<!-- LOGIN -->
<div class="wrap" id="loginView">
  <div class="login">
    <h1 style="text-align:center; margin-bottom:20px;">House of Ranishè · Admin</h1>
    <input id="token" type="password" placeholder="Admin token" autocomplete="current-password">
    <button class="btn" style="width:100%;" id="loginBtn">Sign In</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<!-- DASHBOARD -->
<div class="wrap hidden" id="dashView">
  <div class="topbar">
    <h1>House of Ranishè · Admin</h1>
    <button class="logout" id="logoutBtn">Sign out</button>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="products">Products</button>
    <button class="tab" data-tab="categories">Categories</button>
    <button class="tab" data-tab="orders">Orders</button>
    <button class="tab" data-tab="reports">Reports &amp; P&amp;L</button>
  </div>

  <!-- PRODUCTS -->
  <section id="tab-products">
    <div class="toolbar">
      <input class="search" id="prodSearch" placeholder="Search products…">
      <button class="btn" id="addProductBtn">+ Add Product</button>
    </div>
    <table>
      <thead><tr><th></th><th>Name</th><th>Category</th><th class="r">Cost</th><th class="r">Price</th><th class="r">Sale</th><th class="r">Stock</th><th></th></tr></thead>
      <tbody id="prodBody"></tbody>
    </table>
  </section>

  <!-- CATEGORIES -->
  <section id="tab-categories" class="hidden">
    <div class="toolbar">
      <span style="font-size:12.5px; color:var(--muted);">Order controls how tabs appear on the storefront.</span>
      <button class="btn" id="addCatBtn">+ Add Category</button>
    </div>
    <table>
      <thead><tr><th>Category</th><th class="r">Sort Order</th><th class="r">Products</th><th></th></tr></thead>
      <tbody id="catBody"></tbody>
    </table>
  </section>

  <!-- ORDERS -->
  <section id="tab-orders" class="hidden">
    <div id="ordersBody"></div>
  </section>

  <!-- REPORTS -->
  <section id="tab-reports" class="hidden">
    <div class="cards" id="reportCards"></div>
    <div class="rsection">
      <h3>Top Sellers</h3>
      <table><thead><tr><th>Product</th><th class="r">Units Sold</th></tr></thead><tbody id="topSellers"></tbody></table>
    </div>
    <div class="rsection">
      <h3>Out of Stock</h3>
      <div id="outStock"></div>
    </div>
    <div class="rsection">
      <h3>Low Stock (≤2 left)</h3>
      <div id="lowStock"></div>
    </div>
  </section>
</div>

<!-- PRODUCT MODAL -->
<div class="modal-bg" id="prodModal">
  <div class="modal">
    <h2 id="prodModalTitle">Add Product</h2>
    <div class="field"><label>Product Name</label><input id="m-name"></div>
    <div class="row2">
      <div class="field"><label>SKU (unique code)</label><input id="m-sku"></div>
      <div class="field"><label>Category</label><select id="m-cat"></select></div>
    </div>
    <div class="row2">
      <div class="field"><label>Cost Price ₹ (for P&amp;L)</label><input id="m-cost" type="number" min="0"></div>
      <div class="field"><label>Stock Qty</label><input id="m-stock" type="number" min="0"></div>
    </div>
    <div class="row2">
      <div class="field"><label>Price ₹ (original)</label><input id="m-price" type="number" min="0"></div>
      <div class="field"><label>Sale Price ₹ (what customer pays)</label><input id="m-sale" type="number" min="0"></div>
    </div>
    <div class="field"><label>Photo</label><input id="m-photo" type="file" accept="image/*"><img id="m-preview" class="preview hidden"></div>
    <div class="field"><label>Description</label><textarea id="m-desc"></textarea></div>
    <div class="err" id="m-err"></div>
    <div class="modal-actions">
      <button class="btn ghost" id="m-cancel">Cancel</button>
      <button class="btn" id="m-save">Save Product</button>
    </div>
  </div>
</div>

<!-- CATEGORY MODAL -->
<div class="modal-bg" id="catModal">
  <div class="modal">
    <h2>Add / Edit Category</h2>
    <div class="field"><label>Category Name</label><input id="c-name"></div>
    <div class="field"><label>Sort Order (0 = first)</label><input id="c-order" type="number" min="0" value="0"></div>
    <div class="err" id="c-err"></div>
    <div class="modal-actions">
      <button class="btn ghost" id="c-cancel">Cancel</button>
      <button class="btn" id="c-save">Save Category</button>
    </div>
  </div>
</div>

<script>
let TOKEN = sessionStorage.getItem('ranishe_admin') || '';
let PRODUCTS = [], CATEGORIES = [];

const H = () => ({'X-Admin-Token': TOKEN, 'Content-Type':'application/json'});
const $ = id => document.getElementById(id);

/* ---------- auth ---------- */
async function tryLogin(tok){
  const res = await fetch('/api/admin/products', {headers:{'X-Admin-Token':tok}});
  return res.ok;
}
$('loginBtn').addEventListener('click', async ()=>{
  const tok = $('token').value.trim();
  if(await tryLogin(tok)){ TOKEN=tok; sessionStorage.setItem('ranishe_admin',tok); showDash(); }
  else $('loginErr').textContent = 'Wrong token.';
});
$('token').addEventListener('keydown', e=>{ if(e.key==='Enter') $('loginBtn').click(); });
$('logoutBtn').addEventListener('click', ()=>{ sessionStorage.removeItem('ranishe_admin'); location.reload(); });

function showDash(){
  $('loginView').classList.add('hidden');
  $('dashView').classList.remove('hidden');
  loadAll();
}

/* ---------- tabs ---------- */
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');
  ['products','categories','orders','reports'].forEach(name=>{
    $('tab-'+name).classList.toggle('hidden', name!==t.dataset.tab);
  });
  if(t.dataset.tab==='orders') loadOrders();
  if(t.dataset.tab==='reports') loadReports();
}));

/* ---------- load ---------- */
async function loadAll(){
  const [p,c] = await Promise.all([
    fetch('/api/admin/products',{headers:H()}).then(r=>r.json()),
    fetch('/api/categories').then(r=>r.json()),
  ]);
  PRODUCTS=p; CATEGORIES=c;
  renderProducts(); renderCategories(); fillCatSelect();
}

/* ---------- products ---------- */
$('prodSearch').addEventListener('input', renderProducts);
function renderProducts(){
  const term = $('prodSearch').value.toLowerCase();
  const list = PRODUCTS.filter(p=>p.name.toLowerCase().includes(term) || p.sku.toLowerCase().includes(term));
  $('prodBody').innerHTML = list.map(p=>`
    <tr>
      <td>${p.image_url?`<img class="thumb" src="${p.image_url}">`:'<div class="thumb"></div>'}</td>
      <td>${p.name}<br><span style="color:var(--muted); font-size:10.5px;">${p.sku}</span></td>
      <td>${p.category}</td>
      <td class="r">₹${p.cost_price}</td>
      <td class="r">₹${p.price}</td>
      <td class="r">₹${p.sale_price}</td>
      <td class="r ${p.stock===0?'soldout':(p.stock<=2?'low':'')}">${p.stock===0?'SOLD OUT':p.stock}</td>
      <td class="r"><button class="btn sm ghost" data-edit="${p.sku}">Edit</button> <button class="btn sm danger" data-del="${p.sku}">Del</button></td>
    </tr>`).join('') || '<tr><td colspan="8" class="empty">No products.</td></tr>';
  $('prodBody').querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',()=>openProduct(b.dataset.edit)));
  $('prodBody').querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',()=>delProduct(b.dataset.del)));
}

function fillCatSelect(){
  $('m-cat').innerHTML = CATEGORIES.map(c=>`<option>${c.name}</option>`).join('');
}

let editingSku = null, photoData = '';
function openProduct(sku){
  const p = sku ? PRODUCTS.find(x=>x.sku===sku) : null;
  editingSku = sku; photoData = p ? (p.image_url||'') : '';
  $('prodModalTitle').textContent = p ? 'Edit Product' : 'Add Product';
  $('m-name').value=p?p.name:''; $('m-sku').value=p?p.sku:''; $('m-sku').disabled=!!p;
  $('m-cost').value=p?p.cost_price:0; $('m-stock').value=p?p.stock:0;
  $('m-price').value=p?p.price:0; $('m-sale').value=p?p.sale_price:0;
  $('m-desc').value=p?(p.description||''):'';
  fillCatSelect(); if(p) $('m-cat').value=p.category;
  const prev=$('m-preview');
  if(photoData){ prev.src=photoData; prev.classList.remove('hidden'); } else prev.classList.add('hidden');
  $('m-err').textContent=''; $('prodModal').classList.add('open');
}
$('addProductBtn').addEventListener('click',()=>openProduct(null));
$('m-cancel').addEventListener('click',()=>$('prodModal').classList.remove('open'));

$('m-photo').addEventListener('change', e=>{
  const file=e.target.files[0]; if(!file) return;
  if(file.size > 800*1024){ $('m-err').textContent='Please use an image under 800KB (compress it first).'; return; }
  const reader=new FileReader();
  reader.onload=()=>{ photoData=reader.result; const prev=$('m-preview'); prev.src=photoData; prev.classList.remove('hidden'); };
  reader.readAsDataURL(file);
});

$('m-save').addEventListener('click', async ()=>{
  const body={
    sku:$('m-sku').value.trim(), name:$('m-name').value.trim(), category:$('m-cat').value,
    cost_price:+$('m-cost').value||0, price:+$('m-price').value||0, sale_price:+$('m-sale').value||0,
    stock:+$('m-stock').value||0, image_url:photoData, description:$('m-desc').value.trim()
  };
  if(!body.sku||!body.name){ $('m-err').textContent='Name and SKU are required.'; return; }
  const res=await fetch('/api/admin/products',{method:'POST',headers:H(),body:JSON.stringify(body)});
  if(!res.ok){ const e=await res.json(); $('m-err').textContent=e.detail||'Could not save.'; return; }
  $('prodModal').classList.remove('open'); await loadAll();
});

async function delProduct(sku){
  if(!confirm('Delete this product permanently?')) return;
  await fetch('/api/admin/products/'+encodeURIComponent(sku),{method:'DELETE',headers:H()});
  await loadAll();
}

/* ---------- categories ---------- */
function renderCategories(){
  const counts={}; PRODUCTS.forEach(p=>counts[p.category]=(counts[p.category]||0)+1);
  $('catBody').innerHTML = CATEGORIES.map(c=>`
    <tr>
      <td>${c.name}</td>
      <td class="r">${c.sort_order}</td>
      <td class="r">${counts[c.name]||0}</td>
      <td class="r"><button class="btn sm ghost" data-cedit="${c.name}" data-corder="${c.sort_order}">Edit</button> <button class="btn sm danger" data-cdel="${c.name}">Del</button></td>
    </tr>`).join('');
  $('catBody').querySelectorAll('[data-cedit]').forEach(b=>b.addEventListener('click',()=>openCat(b.dataset.cedit,b.dataset.corder)));
  $('catBody').querySelectorAll('[data-cdel]').forEach(b=>b.addEventListener('click',()=>delCat(b.dataset.cdel)));
}
function openCat(name,order){
  $('c-name').value=name||''; $('c-name').disabled=!!name;
  $('c-order').value=order||0; $('c-err').textContent=''; $('catModal').classList.add('open');
}
$('addCatBtn').addEventListener('click',()=>openCat('',0));
$('c-cancel').addEventListener('click',()=>$('catModal').classList.remove('open'));
$('c-save').addEventListener('click', async ()=>{
  const body={name:$('c-name').value.trim(), sort_order:+$('c-order').value||0};
  if(!body.name){ $('c-err').textContent='Name required.'; return; }
  const res=await fetch('/api/admin/categories',{method:'POST',headers:H(),body:JSON.stringify(body)});
  if(!res.ok){ $('c-err').textContent='Could not save.'; return; }
  $('catModal').classList.remove('open');
  CATEGORIES=await fetch('/api/categories').then(r=>r.json()); renderCategories(); fillCatSelect();
});
async function delCat(name){
  if(!confirm('Delete this category? Products keep their tag but the tab disappears.')) return;
  await fetch('/api/admin/categories/'+encodeURIComponent(name),{method:'DELETE',headers:H()});
  CATEGORIES=await fetch('/api/categories').then(r=>r.json()); renderCategories(); fillCatSelect();
}

/* ---------- orders ---------- */
async function loadOrders(){
  const orders=await fetch('/api/admin/orders',{headers:H()}).then(r=>r.json());
  if(orders.length===0){ $('ordersBody').innerHTML='<div class="empty">No orders yet.</div>'; return; }
  $('ordersBody').innerHTML = orders.map(o=>`
    <div style="border:1px solid var(--line); background:var(--paper); padding:16px 18px; margin-bottom:14px;">
      <div style="display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;">
        <strong style="letter-spacing:0.05em;">${o.id}</strong>
        <select class="status-sel" data-oid="${o.id}">
          ${['new','confirmed','shipped','delivered','cancelled'].map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}
        </select>
      </div>
      <div style="font-size:12px; color:var(--muted); margin-top:8px; line-height:1.6;">
        ${new Date(o.created_at).toLocaleString('en-IN')}<br>
        <strong>${o.customer_name}</strong> · ${o.phone}<br>${o.address}
      </div>
      <table style="margin-top:10px;">${o.items.map(it=>`<tr><td>${it.name} × ${it.qty}</td><td class="r">₹${it.unit_price*it.qty}</td></tr>`).join('')}</table>
      <div style="text-align:right; font-weight:500; margin-top:8px;">Total ₹${o.total}</div>
    </div>`).join('');
  $('ordersBody').querySelectorAll('.status-sel').forEach(s=>s.addEventListener('change', async ()=>{
    await fetch(`/api/admin/orders/${s.dataset.oid}/status?status=${s.value}`,{method:'POST',headers:H()});
    loadReports();
  }));
}

/* ---------- reports ---------- */
async function loadReports(){
  const r=await fetch('/api/admin/reports',{headers:H()}).then(x=>x.json());
  const pnlClass = r.gross_profit>=0?'pos':'neg';
  $('reportCards').innerHTML = `
    <div class="rcard"><div class="label">Revenue</div><div class="val">₹${r.revenue.toLocaleString('en-IN')}</div></div>
    <div class="rcard"><div class="label">Cost of Goods</div><div class="val">₹${r.cogs.toLocaleString('en-IN')}</div></div>
    <div class="rcard"><div class="label">Gross Profit</div><div class="val ${pnlClass}">₹${r.gross_profit.toLocaleString('en-IN')}</div></div>
    <div class="rcard"><div class="label">Orders</div><div class="val">${r.order_count}</div></div>
    <div class="rcard"><div class="label">Avg Order Value</div><div class="val">₹${r.avg_order_value}</div></div>
    <div class="rcard"><div class="label">Products Live</div><div class="val">${r.product_count}</div></div>
    <div class="rcard"><div class="label">Stock Value (cost)</div><div class="val">₹${r.stock_value_cost.toLocaleString('en-IN')}</div></div>
    <div class="rcard"><div class="label">Out of Stock</div><div class="val ${r.out_of_stock_count?'neg':''}">${r.out_of_stock_count}</div></div>`;
  $('topSellers').innerHTML = r.top_sellers.filter(t=>t.units>0).map(t=>`<tr><td>${t.name}</td><td class="r">${t.units}</td></tr>`).join('') || '<tr><td colspan="2" class="empty">No sales yet.</td></tr>';
  $('outStock').innerHTML = r.out_of_stock.length? r.out_of_stock.map(p=>`<span style="display:inline-block; margin:0 8px 8px 0; font-size:12px; color:var(--rani);">${p.name}</span>`).join('') : '<div class="empty">Nothing out of stock. 🎉</div>';
  $('lowStock').innerHTML = r.low_stock.length? r.low_stock.map(p=>`<span style="display:inline-block; margin:0 8px 8px 0; font-size:12px; color:var(--gold);">${p.name} (${p.stock})</span>`).join('') : '<div class="empty">No low-stock items.</div>';
}

/* auto-login if token stored */
if(TOKEN){ tryLogin(TOKEN).then(ok=>{ if(ok) showDash(); else sessionStorage.removeItem('ranishe_admin'); }); }
</script>
</body>
</html>
